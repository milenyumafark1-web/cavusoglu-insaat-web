name: Temporary network diagnostic

on:
  push:
    branches:
      - temp/network-diagnostic-20260726
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout temporary diagnostic branch
        uses: actions/checkout@v4

      - name: Discover Coolify and Traefik routes
        run: python3 scripts/temp_coolify_discovery.py
